<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivocredit - Payment Request</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
.container{
  max-width:430px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  margin-top:35px;
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}
.logo{
  width:58px;height:58px;border-radius:16px;
  background:#1769ff;color:white;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:bold;margin:auto;
}
h1{text-align:center;font-size:24px;margin:15px 0 5px}
.subtitle{text-align:center;color:#687386;font-size:14px}
.amount{text-align:center;font-size:38px;font-weight:bold;margin:25px 0}
.info{background:#f6f8fc;border-radius:14px;padding:15px}
.row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.label{color:#718096}.value{font-weight:bold}
.qr{text-align:center;margin:20px 0}
.qr img{width:190px;height:190px;border-radius:12px}
.pay{
  display:block;width:100%;padding:16px;border:0;
  border-radius:13px;background:#1769ff;color:white;
  font-size:17px;font-weight:bold;text-decoration:none;text-align:center;
}
.note{text-align:center;color:#7b8494;font-size:12px;margin-top:18px;line-height:1.5}
.timer{text-align:center;color:#d33;font-weight:bold;margin-bottom:15px}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="logo">₹</div>

<h1>Nivocredit</h1>
<div class="subtitle">Secure UPI Payment</div>

<div class="amount" id="amount">₹0</div>

<div class="timer">
Link expires in: <span id="timer">30:00</span>
</div>

<div class="info">

<div class="row">
<span class="label">Customer</span>
<span class="value" id="customer">Customer</span>
</div>

<div class="row">
<span class="label">Invoice</span>
<span class="value" id="invoice">INV-001</span>
</div>

<div class="row">
<span class="label">UPI ID</span>
<span class="value">7004738614@mbk</span>
</div>

</div>

<div class="qr">
<img id="qr" src="" alt="UPI QR Code">
</div>

<a id="payButton" class="pay" href="#">
Pay with UPI
</a>

<div class="note">
Please verify the payment details before completing your payment.
This page is only a payment request interface and does not itself
confirm successful payment.
</div>

</div>
</div>

<script>

const UPI_ID = "7004738614@mbk";
const BUSINESS_NAME = "Nivocredit";

/* Read information from URL */
const params = new URLSearchParams(window.location.search);

const CUSTOMER_NAME = params.get("customer") || "Customer";
const AMOUNT = params.get("amount") || "0";
const INVOICE = params.get("invoice") || "INV-001";

/* Show details */
document.getElementById("amount").innerText = "₹" + AMOUNT;
document.getElementById("customer").innerText = CUSTOMER_NAME;
document.getElementById("invoice").innerText = INVOICE;

/* Create UPI payment link */
const upiLink =
"upi://pay?pa=" + encodeURIComponent(UPI_ID) +
"&pn=" + encodeURIComponent(BUSINESS_NAME) +
"&am=" + encodeURIComponent(AMOUNT) +
"&cu=INR" +
"&tn=" + encodeURIComponent("Invoice " + INVOICE);

/* Create QR */
document.getElementById("qr").src =
"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
encodeURIComponent(upiLink);

/* Pay button */
document.getElementById("payButton").href = upiLink;

/* 30 minute timer */
let seconds = 30 * 60;

function countdown(){
let min = Math.floor(seconds / 60);
let sec = seconds % 60;

document.getElementById("timer").innerText =
String(min).padStart(2,"0") + ":" +
String(sec).padStart(2,"0");

if(seconds > 0) seconds--;
}

countdown();
setInterval(countdown,1000);

</script>

</body>
</html>

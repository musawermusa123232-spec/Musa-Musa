<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivocredit - Professional Payment Request</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #0d6efd;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .pay-btn {
      display: block;
      width: 100%;
      background-color: #28a745;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Nivocredit Payment</h2>

    <div class="form-group">
      <label for="custName">Customer Name:</label>
      <input type="text" id="custName" placeholder="Customer name enter karein">
    </div>

    <div class="form-group">
      <label for="amount">Amount (₹):</label>
      <input type="number" id="amount" placeholder="Amount enter karein">
    </div>

    <a id="payLink" href="#" class="pay-btn" onclick="generateLink(event)">Pay Now via UPI</a>
  </div>

  <script>
    function generateLink(event) {
      // Aapki UPI Details Pehle Se Set Hain:
      const myUpiId = "7004738614@mbk";
      const myName = "Nivocredit";

      const customerName = document.getElementById('custName').value.trim();
      const amount = document.getElementById('amount').value.trim();

      if (!amount || amount <= 0) {
        alert("Kripya sahi amount enter karein!");
        event.preventDefault();
        return false;
      }

      const note = encodeURIComponent("Payment from " + (customerName || "Customer"));
      const upiUrl = `upi://pay?pa=${myUpiId}&pn=${encodeURIComponent(myName)}&am=${amount}&tn=${note}&cu=INR`;

      document.getElementById('payLink').href = upiUrl;
    }
  </script>

</body>
</html>
